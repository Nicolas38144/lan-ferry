<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>File Transfer — PC</title><link rel="stylesheet" href="/style.css"><style>.admin{text-align:center}.admin svg{max-width:260px;width:100%;height:auto;background:#fff;padding:10px;border-radius:12px}.admin code{overflow-wrap:anywhere}.admin ul{text-align:left;max-height:none}.admin li{display:block}</style></head><body><main class="shell admin"><h1>File Transfer</h1><p>Scannez ce QR code avec votre téléphone connecté au même réseau.</p><section class="card">{{QR}}<p><code>{{URL}}</code></p><p>Dossier : <strong>{{DESTINATION}}</strong></p></section><section class="card"><h2>Session</h2><p id="summary">En attente de transferts</p><ul id="history"></ul></section></main><script>async function refresh(){try{const r=await fetch('/admin/status');const s=await r.json();document.getElementById('summary').textContent=`${s.files.length} fichier(s) reçu(s) · ${s.active.length} transfert(s) en cours`;const l=document.getElementById('history');l.replaceChildren();for(const f of s.files.slice(-30).reverse()){const e=document.createElement('li');e.textContent=`${f.savedAs} — SHA-256 vérifié`;l.append(e)}}catch{document.getElementById('summary').textContent='Serveur indisponible'}}refresh();setInterval(refresh,2000)</script></body></html>
